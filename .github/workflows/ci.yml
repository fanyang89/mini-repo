name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install --global pnpm@12.11.2
      - name: Install build and RPM test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsqlite3-dev rpm dnf
          rustup toolchain install 1.100.0 --profile minimal
          rustup override set 1.100.0
      - run: cargo build --locked
      - run: pnpm --dir web lint
      - run: cargo test --workspace --locked
      - run: pnpm --dir web exec playwright install --with-deps --only-shell chromium
      - run: python3 tests/smoke.py --ui
